name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    name: Managed quality
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run local quality checks
        shell: pwsh
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:QUALITY_BASE_REF
          if ($base -and $base -notmatch '^0+$') {
            ./eng/Check-Quality.ps1 -BaseRef $base
          } else {
            ./eng/Check-Quality.ps1
          }
